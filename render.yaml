services:
  - type: web
    name: bibliotech-back
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./bibliotech.db
      - key: PYTHON_VERSION
        value: 3.11.9
